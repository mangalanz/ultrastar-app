<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canciones Ultrastar</title>
<style>
  :root { --bg:#f7f7f7; --card:#ffffff; --accent:#ff3d6e; --text:#1a1a1a; --muted:#777; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }

  /* Portada / banner de introducción a pantalla completa */
  .hero {
    position:relative;
    height: 100vh;
    display:flex; align-items:flex-end; justify-content:center;
    background-image:
      linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.25) 60%, var(--bg) 100%),
      url("https://raw.githubusercontent.com/mangalanz/ultrastar-app/main/f7593c74-fc19-46d4-ad41-8941ab6bde6b.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    text-align:center;
    padding: 24px 16px 60px;
  }
  .hero-content h1 {
    margin:0 0 6px; font-size: clamp(2rem, 6vw, 3.5rem); color:#fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  .hero-content p {
    margin:0; color:#eee; font-size:1rem; letter-spacing:1px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
  }

  /* Contenido: cajas blancas "integradas" sobre el fondo claro, subiendo un poco sobre el hero */
  .contenido {
    position:relative;
    margin-top:-40px;
    background:var(--bg);
    border-radius:24px 24px 0 0;
    padding-top: 20px;
  }

  header { padding: 8px 16px 0; text-align:center; }
  header h1 { margin:0 0 4px; font-size:1.8rem; }
  header p { margin:0; color:var(--muted); }
  nav { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:12px 16px; }
  nav a {
    background:var(--card); color:var(--text); text-decoration:none;
    padding:8px 14px; border-radius:20px; font-size:0.9rem; border:1px solid #ddd;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  nav a:hover { border-color: var(--accent); }

  /* Layout de dos columnas: buscador+lista a la izquierda, Kara-moe fijo a la derecha */
  .layout {
    display:grid;
    grid-template-columns: 1fr 260px;
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px;
    align-items: start;
  }
  .columna-principal { min-width: 0; }
  .barra-lateral {
    position: sticky;
    top: 16px;
    background: var(--card);
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .barra-lateral h2 {
    font-size: 1rem; margin: 0 0 10px; color: var(--muted); font-weight:600;
  }
  .barra-lateral a {
    display:block; text-align:center; margin-top:6px; padding:10px 16px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius: 20px; font-weight:600; font-size:0.9rem;
  }
  /* En pantallas estrechas, la barra lateral pasa a ocupar todo el ancho y va después de la lista */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .barra-lateral { position: static; order: 2; }
    .columna-principal { order: 1; }
  }

  .search-wrap { padding: 12px 0; }
  #buscador {
    width:100%; padding:12px 16px; border-radius:12px; border:1px solid #ddd;
    background:var(--card); color:var(--text); font-size:1rem;
  }
  #estado { text-align:center; color:var(--muted); padding:8px; font-size:0.9rem; }
  #lista {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:14px; padding:16px 0;
  }
  .cancion {
    background:var(--card); border-radius:12px; overflow:hidden; border:1px solid #eee;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .cancion img {
    width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#eee;
  }
  .cancion .info { padding:8px 10px; }
  .cancion .titulo { font-weight:600; font-size:0.9rem; }
  .cancion .artista { color:var(--muted); font-size:0.8rem; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1>Canciones Ultrastar</h1>
    <p>CANTAR UNE LOS CORAZONES</p>
  </div>
</div>

<div class="contenido">

<header>
  <p style="color:var(--muted); margin:0;">KARAOKEROS EN ACCIÓN</p>
</header>

<nav>
  <!-- Formulario de peticiones (Google Forms) — acción principal -->
  <a href="https://docs.google.com/forms/d/e/1FAIpQLScQ_J_FM6p9-1_INZMFJdtU5yuFMgauPFU9g65H2s_mIm9GKA/viewform" target="_blank" rel="noopener">Pedir Canción</a>
</nav>

<div class="layout">
  <div class="columna-principal">
    <div class="search-wrap">
      <input id="buscador" type="text" placeholder="Buscar por título, serie o artista...">
      <select id="categoria" style="width:100%; margin-top:10px; padding:10px 14px; border-radius:12px;
               border:1px solid #333; background:var(--card); color:var(--text); font-size:0.95rem;">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <div id="estado">Cargando canciones...</div>
    <div id="lista"></div>
  </div>

  <aside class="barra-lateral">
    <h2>¿No encuentras tu canción?</h2>
    <a href="https://kara.moe/search" target="_blank" rel="noopener">Buscar en Kara-moe →</a>
  </aside>
</div>

</div><!-- /.contenido -->

<script>
/* ============ CONFIGURA ESTOS 3 VALORES ============ */
// ID real de tu Google Sheet (lo ves en la URL: /spreadsheets/d/ESTE_ID/edit)
const SHEET_ID = "1Mk8bEWzGt4gbt3t7FnbeDT4-ArI0L9tp1dyyQJU7IB8";
// Nombre EXACTO de la pestaña que contiene los datos (como aparece abajo en la hoja)
const TAB_NAME = "Lista";
// URL de tu mapeo.json (subido junto a las imágenes en R2, o en un repo GitHub con jsDelivr)
const MAPEO_URL = "https://pub-6eaebff955624e44818a31fa86131835.r2.dev/ultrastar-im-genes/mapeo.json";
/* ===================================================== */

const estadoEl = document.getElementById("estado");
const listaEl = document.getElementById("lista");
const buscadorEl = document.getElementById("buscador");
const categoriaEl = document.getElementById("categoria");

let canciones = [];   // datos de la hoja
let mapeoImagenes = {}; // clave "Artista - Titulo" -> url imagen

function normalizar(txt) {
  return (txt || "").toString().trim().toLowerCase();
}

// Limpia texto para comparar: sin tildes, minúsculas, sin (TV)/(full)/etc, sin ningún separador
// (se eliminan espacios/guiones/símbolos por completo, no se sustituyen por espacio,
// así "Te-ze" y "Teze" se consideran iguales al comparar)
function limpiar(txt) {
  return (txt || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // quita tildes
    .toLowerCase()
    .replace(/\(.*?\)/g, "")   // quita paréntesis tipo (TV), (full)
    .replace(/[^a-z0-9]+/g, "")
    .trim();
}

// Carpeta base donde están las imágenes en R2 (misma carpeta que mapeo.json)
const IMG_BASE_URL = MAPEO_URL.substring(0, MAPEO_URL.lastIndexOf("/"));

// Índice de imágenes ya "limpiadas" para buscar coincidencias por contención de texto
let indiceImagenes = [];
function construirIndiceImagenes() {
  indiceImagenes = Object.values(mapeoImagenes)
    .filter(e => e && e.imagen)
    .map(e => {
      const tituloLimpio = limpiar(e.titulo);
      return {
        tituloLimpio,
        tituloSinEspacios: tituloLimpio.replace(/\s+/g, ""),
        artistaLimpio: limpiar(e.artista),
        url: `${IMG_BASE_URL}/${encodeURIComponent(e.imagen)}`
      };
    })
    .filter(e => e.tituloLimpio.length > 0);
}

function buscarImagen(artistaTitulo) {
  const texto = limpiar(artistaTitulo);
  if (!texto) return null;
  // Coincidencia: el título de la imagen aparece dentro del texto de la fila, o viceversa
  let mejor = null;
  for (const img of indiceImagenes) {
    const coincide = texto.includes(img.tituloLimpio) || img.tituloLimpio.includes(texto);
    if (coincide) {
      if (!mejor || img.tituloLimpio.length > mejor.tituloLimpio.length) mejor = img;
    }
  }
  return mejor ? mejor.url : null;
}

function render(lista) {
  listaEl.innerHTML = "";
  if (lista.length === 0) {
    estadoEl.textContent = "No se encontraron canciones.";
    return;
  }
  estadoEl.textContent = `${lista.length} canciones`;

  const frag = document.createDocumentFragment();
  lista.forEach(c => {
    const urlImg = buscarImagen(c.artistaTitulo);

    const div = document.createElement("div");
    div.className = "cancion";
    div.innerHTML = `
      <img src="${urlImg || ''}" alt="${c.artistaTitulo}"
           onerror="this.onerror=null;this.src='https://placehold.co/300x300/eeeeee/999?text=%E2%99%AA';">
      <div class="info">
        <div class="titulo">${c.artistaTitulo}</div>
        <div class="artista">${c.serie}${c.tipo ? " · " + c.tipo : ""}</div>
      </div>`;
    frag.appendChild(div);
  });
  listaEl.appendChild(frag);
}

function filtrar(texto, categoria) {
  const q = normalizar(texto);
  return canciones.filter(c => {
    const coincideTexto = !q ||
      normalizar(c.artistaTitulo).includes(q) ||
      normalizar(c.serie).includes(q) ||
      normalizar(c.tipo).includes(q);
    const coincideCategoria = !categoria || c.categoria === categoria;
    return coincideTexto && coincideCategoria;
  });
}

function aplicarFiltros() {
  render(filtrar(buscadorEl.value, categoriaEl.value));
}

buscadorEl.addEventListener("input", aplicarFiltros);
categoriaEl.addEventListener("change", aplicarFiltros);

function poblarCategorias() {
  const categorias = [...new Set(canciones.map(c => c.categoria).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
  categorias.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    // Primera letra mayúscula, resto tal cual, solo para mostrar más bonito
    opt.textContent = cat.charAt(0) + cat.slice(1).toLowerCase();
    categoriaEl.appendChild(opt);
  });
}

async function cargarTodo() {
  try {
    // 1) Datos de la hoja (vía proxy JSON, evita el pubhtml roto)
    const urlHoja = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(TAB_NAME)}`;
    const [respHoja, respMapeo] = await Promise.all([
      fetch(urlHoja),
      fetch(MAPEO_URL).catch(() => null) // si falla el mapeo, seguimos sin imágenes
    ]);

    if (!respHoja.ok) throw new Error("No se pudo leer la hoja de canciones");
    const filas = await respHoja.json();

    // Columnas reales de tu hoja: SERIE/PELICULA, Tipo, Artista/Titulo, Idioma, Categoria
    canciones = filas.map(f => ({
      serie: (f["SERIE/PELICULA"] || "").trim(),
      tipo: (f["Tipo"] || "").trim(),
      artistaTitulo: (f["Artista/Titulo"] || "").trim(),
      idioma: (f["Idioma"] || "").trim(),
      categoria: (f["CATEGORIA"] || f["Categoria"] || "").trim().toUpperCase()
    })).filter(c => c.artistaTitulo);

    if (respMapeo && respMapeo.ok) {
      mapeoImagenes = await respMapeo.json();
      construirIndiceImagenes();
    }

    poblarCategorias();
    render(canciones);
  } catch (err) {
    estadoEl.textContent = "Error cargando canciones: " + err.message;
    console.error(err);
  }
}

cargarTodo();
</script>

</body>
</html>
